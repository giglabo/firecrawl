name: Build Custom Images

# Never builds on a plain branch push. Three entry points, by intent:
#   pull_request      -> validate only (amd64, `load` not `push`, no manifest)
#   push tags v*      -> publish :latest and :<version> to GHCR
#   workflow_dispatch -> manual publish / force a full rebuild
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build all images regardless of changes"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4

      - name: Force all on tag push or manual dispatch
        id: force
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ inputs.force_all }}" == "true" ]]; then
            echo "force=true" >> $GITHUB_OUTPUT
          else
            echo "force=false" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: changes
        if: steps.force.outputs.force == 'false'
        with:
          filters: |
            api:
              - 'apps/api/**'
            playwright:
              - 'apps/playwright-service-ts/**'

      - name: Set outputs
        id: filter
        run: |
          if [[ "${{ steps.force.outputs.force }}" == "true" ]]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "playwright=true" >> $GITHUB_OUTPUT
          else
            echo "api=${{ steps.changes.outputs.api }}" >> $GITHUB_OUTPUT
            echo "playwright=${{ steps.changes.outputs.playwright }}" >> $GITHUB_OUTPUT
          fi

  build-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Skip arm64 on PRs
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/arm64'
        run: echo "SKIP=true" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - name: Set up QEMU
        if: env.SKIP != 'true' && matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.SKIP != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SKIP != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        if: env.SKIP != 'true'
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract platform suffix
        if: env.SKIP != 'true'
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SUFFIX=${platform//\//-}" >> $GITHUB_ENV

      - name: Build API image
        if: env.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:${{ env.PLATFORM_SUFFIX }}
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=api-${{ env.PLATFORM_SUFFIX }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_SUFFIX }}

  manifest-api:
    runs-on: ubuntu-latest
    needs: build-api
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:latest \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:linux-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:latest

      - name: Create and push multi-arch manifest (version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:linux-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/firecrawl:${{ env.VERSION }}

  build-playwright:
    needs: detect-changes
    if: needs.detect-changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Skip arm64 on PRs
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/arm64'
        run: echo "SKIP=true" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - name: Set up QEMU
        if: env.SKIP != 'true' && matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.SKIP != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SKIP != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        if: env.SKIP != 'true'
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract platform suffix
        if: env.SKIP != 'true'
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SUFFIX=${platform//\//-}" >> $GITHUB_ENV

      - name: Build Playwright image
        if: env.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/playwright-service-ts
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:${{ env.PLATFORM_SUFFIX }}
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=playwright-${{ env.PLATFORM_SUFFIX }}
          cache-to: type=gha,mode=max,scope=playwright-${{ env.PLATFORM_SUFFIX }}

  manifest-playwright:
    runs-on: ubuntu-latest
    needs: build-playwright
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:latest \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:linux-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:latest

      - name: Create and push multi-arch manifest (version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:linux-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/playwright-service:${{ env.VERSION }}
